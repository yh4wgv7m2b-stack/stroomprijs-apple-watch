name: Diagnose EnergyZero API
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-energyzero.yml"
      - "sw.js"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe documented and legacy endpoints, including CORS
        shell: bash
        run: |
          set -u
          TODAY="$(TZ=Europe/Amsterdam date +%d-%m-%Y)"
          TOMORROW="$(TZ=Europe/Amsterdam date -d tomorrow +%d-%m-%Y)"
          ORIGIN="https://yh4wgv7m2b-stack.github.io"
          probe() {
            label="$1"; url="$2"
            headers="$(mktemp)"; body="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 25 -H "Origin: $ORIGIN" -H "Accept: application/json" -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "===== $label ====="
            echo "URL: $url"
            echo "HTTP: $status"
            echo "CORS:"
            grep -iE '^(access-control-allow-origin|access-control-allow-methods|vary):' "$headers" | tr -d '\r' || true
            python3 - "$body" <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          try:
              data=json.loads(raw)
              print("JSON keys:", list(data)[:20] if isinstance(data,dict) else type(data).__name__)
              if isinstance(data,dict):
                  for k in ("base_with_vat","all_in_with_vat","base","all_in"):
                      v=data.get(k)
                      if isinstance(v,list):
                          print(f"{k} count:",len(v))
                          if v: print("sample:",json.dumps(v[0],ensure_ascii=False)[:350])
              else: print("JSON sample:",json.dumps(data,ensure_ascii=False)[:500])
          except Exception:
              print("BODY:",raw[:500].replace("\n"," "))
          PY
            rm -f "$headers" "$body"
          }
          for path in "/v1/prices" "/public/v1/prices"; do
            for style in snake camel; do
              if [ "$style" = snake ]; then
                params="energy_type=ENERGY_TYPE_ELECTRICITY"
              else
                params="energyType=ENERGY_TYPE_ELECTRICITY"
              fi
              probe "$path $style TODAY" "https://public.api.energyzero.nl$path?date=$TODAY&interval=INTERVAL_QUARTER&$params"
              probe "$path $style TOMORROW" "https://public.api.energyzero.nl$path?date=$TOMORROW&interval=INTERVAL_QUARTER&$params"
            done
          done
          echo "===== CORS preflight documented endpoint ====="
          curl --silent --show-error --location --max-time 25 -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: accept" -D - -o /dev/null "https://public.api.energyzero.nl/v1/prices" | grep -iE '^(HTTP/|access-control-allow-origin|access-control-allow-methods|access-control-allow-headers|vary:)' | tr -d '\r' || true

      - name: Check published GitHub Pages and render the real app in Chromium
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://yh4wgv7m2b-stack.github.io/stroomprijs-apple-watch/"
          curl --fail --silent --show-error --location --max-time 30 "$SITE?smoke=$GITHUB_RUN_ID" -o /tmp/live-index.html
          grep -q "public.api.energyzero.nl/v1/prices" /tmp/live-index.html
          echo "Published page: HTTP 200; documented API endpoint found in live HTML."
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error --location --max-time 20 "$SITE/sw.js?smoke=$GITHUB_RUN_ID" -o /tmp/live-sw.js || true
            if grep -q "stroomprijs-v3" /tmp/live-sw.js 2>/dev/null; then break; fi
            sleep 5
          done
          grep -q "stroomprijs-v3" /tmp/live-sw.js
          echo "Published service worker: cache v3."
          npm install --no-save playwright
          npx playwright install chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            try {
              const context = await browser.newContext({ timezoneId: 'Europe/Amsterdam', serviceWorkers: 'allow' });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
              await page.goto('https://yh4wgv7m2b-stack.github.io/stroomprijs-apple-watch/?smoke=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => {
                const price = document.querySelector('#current')?.textContent?.trim();
                const chart = document.querySelector('#chart');
                return price && price !== '—' && chart && chart.children.length > 0;
              }, null, { timeout: 45000 });
              const result = await page.evaluate(() => ({
                current: document.querySelector('#current')?.textContent?.trim(),
                badge: document.querySelector('#badge')?.textContent?.trim(),
                minimum: document.querySelector('#min')?.textContent?.trim(),
                maximum: document.querySelector('#max')?.textContent?.trim(),
                average: document.querySelector('#avg')?.textContent?.trim(),
                chartElements: document.querySelector('#chart')?.children.length,
                cheapestRows: document.querySelectorAll('#cheap .row').length,
                status: document.querySelector('#status')?.textContent?.trim()
              }));
              console.log('LIVE APP DATA:', JSON.stringify(result));
              if (!result.current || result.current === '—' || !result.chartElements || !result.cheapestRows) throw new Error('Live page did not render price data, chart and cheapest periods.');
              if (errors.length) console.log('BROWSER ERRORS:', JSON.stringify(errors));
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
