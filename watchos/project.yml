name: StroomprijsWatch
options:
  bundleIdPrefix: nl.stroomprijs
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  StroomprijsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.stroomprijs.watch
        PRODUCT_NAME: Stroomprijs
        INFOPLIST_KEY_CFBundleDisplayName: Stroomprijs
        INFOPLIST_KEY_WKApplication: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
  StroomprijsWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/Widget
    dependencies:
      - target: StroomprijsWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.stroomprijs.watch.widget
        PRODUCT_NAME: StroomprijsWidget
        INFOPLIST_KEY_CFBundleDisplayName: Stroomprijs
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
